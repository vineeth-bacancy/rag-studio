[project]
name = "rag-studio"
version = "0.1.0"
description = "A local app that answers questions about PDF reports with page citations, and shows how every RAG step works."
requires-python = ">=3.12,<3.13"
# Dependencies arrive with the milestone that needs them, so every package here
# is one the code actually imports. Declared once, here; pinned in uv.lock.
dependencies = [
    "fastapi>=0.143.1",
    "uvicorn[standard]>=0.54.0",
    "httpx>=0.28.1",
    "pymupdf==1.28.2",
    "lancedb==0.40.0",
    # M2: the layout-aware parser. Only `./rag ingest` loads its models; the
    # API reads the converted documents from the cache.
    "docling==2.139.0",
    # Docling needs torch. These two come from PyTorch's CPU index (below):
    # about 200 MB instead of about 3 GB of CUDA wheels this laptop cannot use.
    "torch>=2.14",
    "torchvision>=0.29",
    # M4: EmbeddingGemma 2 runs in this process (Ollama's tags for it need the
    # MLX runner, which Linux lacks). transformers 5.19 added the model;
    # sentence-transformers 6.1 is what its config requires. M5's reranker
    # uses the same stack.
    "sentence-transformers>=6.1",
    "transformers>=5.19",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    # Starlette 1.8's TestClient prefers httpx2 and warns on httpx.
    "httpx2>=2.13.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true   # used only by the packages pinned to it in [tool.uv.sources]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rag_studio"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests that need Ollama or a Colab runtime carry these markers and skip cleanly
# when the service is absent (see tests/conftest.py).
markers = [
    "ollama: needs a reachable local Ollama",
    "colab: needs a connected Colab runtime",
    "st: needs a downloaded sentence-transformers model and about 3 GB of free memory",
    "rerank: needs the downloaded Qwen3-Reranker-0.6B and about 4 GB of free memory",
]
